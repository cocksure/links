    <title>Sanjar — links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; --bg:#0d0e12; --card:#15171d; --line:#292c35; --muted:#9297a5; --ink:#f4f5f8; --lime:#c6f36b; }
      *,*::before,*::after { box-sizing:border-box; }
      html { min-height:100%; background:var(--bg); }
      body { min-height:100vh; margin:0; color:var(--ink); font:15px/1.4 Onest,system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; background:var(--bg); }
      body::before,body::after { content:""; position:fixed; z-index:0; width:92vmax; height:92vmax; border-radius:50%; filter:blur(76px); pointer-events:none; opacity:.34; will-change:transform; }
      body::before { top:-62vmax; left:calc(50% - 46vmax); background:radial-gradient(circle,#b7ec5d 0,rgba(183,236,93,.48) 19%,transparent 66%); animation:aurora 12s ease-in-out infinite alternate; }
      body::after { right:-64vmax; bottom:-64vmax; background:radial-gradient(circle,#8f79ff 0,rgba(143,121,255,.48) 20%,transparent 67%); animation:aurora 15s ease-in-out infinite alternate-reverse; }
      a { color:inherit; text-decoration:none; }
      .page { position:relative; z-index:1; width:min(100% - 32px,460px); margin:0 auto; padding:clamp(24px,6vh,56px) 0 max(32px,env(safe-area-inset-bottom)); }
      .links { display:grid; gap:10px; }
      .link { --accent:var(--lime); position:relative; display:flex; align-items:center; min-height:68px; gap:14px; padding:11px 14px; border:1px solid var(--line); border-radius:17px; overflow:hidden; isolation:isolate; background:linear-gradient(110deg,color-mix(in srgb,var(--accent) 7%,var(--card)),var(--card) 64%); box-shadow:0 8px 24px #0002; animation:enter .55s cubic-bezier(.2,.75,.25,1) both,edgePulse 7s ease-in-out 1s infinite; animation-delay:0ms,1s; transition:transform .22s,border-color .22s,box-shadow .22s; -webkit-tap-highlight-color:transparent; }
      .link::before { content:""; position:absolute; z-index:1; inset:0 auto 0 0; width:2px; background:var(--accent); opacity:.7; transform:scaleY(.35); transition:transform .25s; }
      .link::after { content:""; position:absolute; z-index:0; top:-70%; bottom:-70%; left:-60%; width:36%; background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 19%,transparent),transparent); transform:translateX(-130%) rotate(16deg); animation:glint 8s cubic-bezier(.2,.6,.3,1) 1.8s infinite; pointer-events:none; }
      .link:nth-child(2) { animation-delay:70ms,1.45s; }.link:nth-child(2)::after { animation-delay:2.3s; }
      .link:nth-child(3) { animation-delay:140ms,1.9s; }.link:nth-child(3)::after { animation-delay:2.8s; }
      .link:nth-child(4) { animation-delay:210ms,2.35s; }.link:nth-child(4)::after { animation-delay:3.3s; }
      .link:nth-child(5) { animation-delay:280ms,2.8s; }.link:nth-child(5)::after { animation-delay:3.8s; }
      .link:nth-child(6) { animation-delay:350ms,3.25s; }.link:nth-child(6)::after { animation-delay:4.3s; }
      .link:nth-child(7) { animation-delay:420ms,3.7s; }.link:nth-child(7)::after { animation-delay:4.8s; }
      .link:nth-child(8) { animation-delay:490ms,4.15s; }.link:nth-child(8)::after { animation-delay:5.3s; }
      .link:hover { transform:translateY(-2px); border-color:color-mix(in srgb,var(--accent) 52%,var(--line)); box-shadow:0 12px 30px #0005,0 0 24px color-mix(in srgb,var(--accent) 8%,transparent); }
      .link:hover::before { transform:scaleY(.72); }
      .icon { position:relative; z-index:1; flex:0 0 40px; width:40px; height:40px; display:grid; place-items:center; border-radius:13px; color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,#202127); }
      .icon svg { width:20px; height:20px; display:block; }
      .copy { position:relative; z-index:1; min-width:0; display:flex; align-items:baseline; flex:1; gap:9px; }
      .name { font-weight:600; letter-spacing:-.015em; white-space:nowrap; }
      .url { min-width:0; overflow:hidden; color:var(--muted); font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
      .product .copy { display:grid; gap:2px; }
      .product .url { font-size:11px; }
      .arrow { position:relative; z-index:1; flex:none; width:18px; height:18px; color:#666b77; transition:transform .2s,color .2s; }
      .link:hover .arrow { color:var(--accent); transform:translate(2px,-2px); }
      .link:active { transform:scale(.975); background:color-mix(in srgb,var(--accent) 13%,var(--card)); }
      .link:active .icon { animation:tap .42s ease-out; }
      .telegram { --accent:#55c6ee; }.facebook { --accent:#78a9ff; }.github { --accent:#e6e8ef; }.phone { --accent:#a9e786; }.portfolio { --accent:#c6f36b; }.resume { --accent:#a99aff; }.facehr { --accent:#55d5b0; }.petlya { --accent:#ff91ad; }
      @keyframes enter { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
      @keyframes aurora { 0% { transform:translate3d(-8vw,-3vh,0) scale(.94);opacity:.22; } 50% { opacity:.4; } 100% { transform:translate3d(11vw,14vh,0) scale(1.16);opacity:.3; } }
      @keyframes glint { 0%,14% { transform:translateX(-130%) rotate(16deg); } 45%,100% { transform:translateX(470%) rotate(16deg); } }
      @keyframes edgePulse { 0%,100% { border-color:var(--line); } 50% { border-color:color-mix(in srgb,var(--accent) 33%,var(--line)); } }
      @keyframes tap { 50% { transform:scale(1.15) rotate(-6deg); } }
      a:focus-visible,button:focus-visible { outline:2px solid var(--lime); outline-offset:3px; }
      @media(max-width:390px) { .page { width:calc(100% - 24px); }.link { min-height:62px; gap:11px; padding:9px 11px; }.icon { width:36px;height:36px;flex-basis:36px; }.copy { display:grid; gap:1px; }.name { font-size:14px; }.url { font-size:11px; } }
      @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important; } }
    </style>
